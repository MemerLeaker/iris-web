    <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span

</div>

                    <label for="recommendation" class="mr-4">Recommendation
                    </label>
                    {{ form.recommendation(class='form-control',  autocomplete="off") }}
                </div>
                <div class="form-group mt-3">
                    <label for="recommendation_description" class="placeholder">Recommendation description</label>
                    {{ form.recommendation_description(class='form-control',  autocomplete="off") }}
